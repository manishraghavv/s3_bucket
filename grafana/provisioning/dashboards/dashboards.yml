# =============================================================================
# Grafana Dashboard Provisioning
#
# Automatically provisions dashboards from the /var/lib/grafana/dashboards/
# directory on Grafana startup.
# =============================================================================

apiVersion: 1

providers:
  - name: "SAP Exporter Dashboards"
    orgId: 1
    folder: "SAP"
    folderUid: "sap"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
