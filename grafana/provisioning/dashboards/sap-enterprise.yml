apiVersion: 1

providers:
  - name: SAP Enterprise Monitoring
    orgId: 1
    folder: SAP Enterprise
    folderUid: sap-enterprise
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
