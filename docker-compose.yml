# =============================================================================
# SAP Enterprise Monitoring Stack — Docker Compose
#
# Architecture:
#   Amazon S3
#     │
#     ▼
#   SAP Exporter (:9105)
#     │
#     ▼
#   Prometheus (:9090)
#     │
#     ▼
#   Grafana (:3000)
#
# Usage:
#   docker compose down --remove-orphans
#   docker compose up --build -d
#   docker compose logs -f
#   docker compose down
# =============================================================================

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:

services:

  # ─────────────────────────────────────────────────────────────────────
  # SAP Prometheus Exporter — reads JSON files from S3, exposes metrics
  # ─────────────────────────────────────────────────────────────────────
  sap-exporter:
    build:
      context: ./exporter
      dockerfile: Dockerfile
    container_name: sap-exporter
    restart: unless-stopped
    ports:
      - "9106:9105"
    env_file:
      - ./.env
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:9105/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─────────────────────────────────────────────────────────────────────
  # Prometheus — scrape the exporter for SAP metrics
  # ─────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: sap-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    depends_on:
      sap-exporter:
        condition: service_healthy
    networks:
      - monitoring
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─────────────────────────────────────────────────────────────────────
  # Grafana — visualise SAP metrics from Prometheus
  # ─────────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: sap-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/sap-exporter-overview.json
      - GF_UNIFIED_ALERTING_ENABLED=false
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - monitoring
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
